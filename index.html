<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Civarda — Yakınındaki Anlara Bak</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05080f;--surface:rgba(11,18,32,0.9);--surface2:rgba(16,24,40,0.97);
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#f0f4ff;--text2:#8b9ab5;--text3:#4a5568;
  --kaza:#ff6b35;--yemek:#10d07e;--etkinlik:#a78bfa;--guvenlik:#ff3b5c;--diger:#6b8cba;
  --accent:#4f8ef7;--accent2:#7c5cfc;
}
html{scroll-behavior:smooth}
body{background:var(--bg);font-family:'DM Sans',system-ui,sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden;padding-bottom:80px}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.025;pointer-events:none;z-index:0}
.bg1{position:fixed;top:-20vh;left:50%;transform:translateX(-50%);width:900px;height:500px;background:radial-gradient(ellipse,rgba(79,142,247,.09) 0%,transparent 70%);pointer-events:none;z-index:0}
.bg2{position:fixed;bottom:-10vh;right:-10vw;width:600px;height:600px;background:radial-gradient(ellipse,rgba(124,92,252,.06) 0%,transparent 70%);pointer-events:none;z-index:0}

/* HEADER */
.hdr{position:sticky;top:0;z-index:90;height:62px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:rgba(5,8,15,.88);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--border)}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.9rem;box-shadow:0 4px 16px rgba(79,142,247,.35);flex-shrink:0}
.logo-txt{font-family:'Syne',sans-serif;font-weight:800;font-size:1.35rem;letter-spacing:-.04em;color:var(--text);line-height:1}
.hdr-stats{display:flex;gap:14px;align-items:center;padding:0 16px;border-right:1px solid var(--border);margin-right:6px}
.hdr-stat{display:flex;flex-direction:column;align-items:center;font-size:.68rem;color:var(--text3);line-height:1.2}
.hdr-stat strong{font-size:.88rem;color:var(--text2);font-weight:700}
@media(max-width:480px){.hdr-stats{display:none}}
.btn-new{height:36px;padding:0 15px;border-radius:9px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:inherit;font-weight:700;font-size:.82rem;cursor:pointer;box-shadow:0 4px 18px rgba(79,142,247,.35);display:flex;align-items:center;gap:5px;transition:transform .15s,box-shadow .15s;white-space:nowrap}
.btn-new:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(79,142,247,.45)}
.btn-new:active{transform:translateY(0)}

/* TICKER */
.ticker-wrap{overflow:hidden;border-bottom:1px solid var(--border);background:rgba(79,142,247,.03);height:33px;display:flex;align-items:center}
.ticker-lbl{flex-shrink:0;padding:0 13px;font-size:.62rem;font-weight:700;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;border-right:1px solid var(--border);height:100%;display:flex;align-items:center;background:rgba(79,142,247,.05)}
.ticker-scrl{overflow:hidden;flex:1}
.ticker-track{display:flex;gap:48px;padding-left:24px;animation:tick 30s linear infinite;white-space:nowrap}
.ticker-track:hover{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tick-item{font-size:.73rem;color:var(--text2);display:flex;align-items:center;gap:6px}
.tick-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

/* CONTROLS */
.controls{padding:13px 14px 0;display:flex;flex-direction:column;gap:9px;position:relative;z-index:1}
.search-wrap{position:relative;display:flex;align-items:center}
.search-ico{position:absolute;left:11px;color:var(--text3);font-size:.88rem;pointer-events:none}
.search-inp{width:100%;height:40px;padding:0 11px 0 34px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.85rem;font-family:inherit;outline:none;transition:border-color .15s,background .15s}
.search-inp::placeholder{color:var(--text3)}
.search-inp:focus{border-color:rgba(79,142,247,.5);background:var(--surface2)}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex-shrink:0;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text3);font-size:.73rem;font-weight:600;font-family:inherit;cursor:pointer;letter-spacing:.02em;transition:all .15s;display:flex;align-items:center;gap:5px}
.fbtn:hover{border-color:var(--border2);color:var(--text2)}
.fbtn.active{font-weight:700}
.fbtn.active[data-cat=all]{background:rgba(240,244,255,.1);border-color:rgba(240,244,255,.22);color:var(--text)}
.fbtn.active[data-cat=kaza]{background:rgba(255,107,53,.13);border-color:rgba(255,107,53,.4);color:var(--kaza)}
.fbtn.active[data-cat=yemek]{background:rgba(16,208,126,.1);border-color:rgba(16,208,126,.38);color:var(--yemek)}
.fbtn.active[data-cat=etkinlik]{background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.38);color:var(--etkinlik)}
.fbtn.active[data-cat=guvenlik]{background:rgba(255,59,92,.1);border-color:rgba(255,59,92,.38);color:var(--guvenlik)}
.fbtn.active[data-cat=diger]{background:rgba(107,140,186,.1);border-color:rgba(107,140,186,.38);color:var(--diger)}
.fcnt{background:rgba(255,255,255,.08);border-radius:4px;padding:1px 5px;font-size:.62rem;font-weight:700;min-width:17px;text-align:center}

/* TRENDING */
.trending{margin:10px 14px 0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 15px;position:relative;z-index:1}
.trending-ttl{font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:9px;display:flex;align-items:center;gap:5px}
.trending-list{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.trending-list::-webkit-scrollbar{display:none}
.trend-chip{flex-shrink:0;padding:4px 11px;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid var(--border);font-size:.73rem;color:var(--text2);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.trend-chip:hover{background:rgba(255,255,255,.08);border-color:var(--border2);color:var(--text)}
.trend-chip-cnt{font-size:.6rem;font-weight:700;background:rgba(255,255,255,.08);border-radius:3px;padding:1px 4px}

/* LIVE BAR */
.live-bar{padding:11px 14px 9px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.live-left{display:flex;align-items:center;gap:8px}
.live-pill{display:flex;align-items:center;gap:5px;background:rgba(255,59,92,.1);border:1px solid rgba(255,59,92,.25);border-radius:6px;padding:3px 8px;font-size:.62rem;font-weight:700;color:var(--guvenlik);letter-spacing:.08em;text-transform:uppercase}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--guvenlik);animation:pdot 1.8s ease infinite}
@keyframes pdot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
.live-cnt{font-size:.76rem;color:var(--text3)}
.sort-btn{background:none;border:none;color:var(--text3);font-size:.73rem;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:6px;transition:color .15s,background .15s}
.sort-btn:hover{color:var(--text2);background:rgba(255,255,255,.05)}

/* FEED */
.feed{display:flex;flex-direction:column;gap:8px;padding:0 12px;position:relative;z-index:1}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;position:relative;transition:transform .18s,box-shadow .18s,border-color .18s;cursor:pointer;opacity:0;transform:translateY(12px);animation:cin .38s ease forwards}
@keyframes cin{to{opacity:1;transform:translateY(0)}}
.card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%}
.card[data-cat=kaza]::before{background:var(--kaza)}
.card[data-cat=yemek]::before{background:var(--yemek)}
.card[data-cat=etkinlik]::before{background:var(--etkinlik)}
.card[data-cat=guvenlik]::before{background:var(--guvenlik)}
.card[data-cat=diger]::before{background:var(--diger)}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.4);border-color:var(--border2)}
.card-inner{padding:13px 15px 13px 18px}
.card-top{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.cat-badge{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.cat-badge[data-cat=kaza]{background:rgba(255,107,53,.12);color:var(--kaza)}
.cat-badge[data-cat=yemek]{background:rgba(16,208,126,.1);color:var(--yemek)}
.cat-badge[data-cat=etkinlik]{background:rgba(167,139,250,.1);color:var(--etkinlik)}
.cat-badge[data-cat=guvenlik]{background:rgba(255,59,92,.1);color:var(--guvenlik)}
.cat-badge[data-cat=diger]{background:rgba(107,140,186,.1);color:var(--diger)}
.new-badge{padding:3px 7px;border-radius:6px;font-size:.58rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,59,92,.15);color:var(--guvenlik);border:1px solid rgba(255,59,92,.25);animation:blink 2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}
.card-time{margin-left:auto;font-size:.68rem;color:var(--text3);white-space:nowrap}
.card-title{font-weight:700;font-size:.95rem;color:var(--text);letter-spacing:-.015em;margin-bottom:4px;line-height:1.3}
.card-desc{font-size:.8rem;color:var(--text2);line-height:1.6;margin-bottom:11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:9px;border-top:1px solid var(--border)}
.card-loc{font-size:.7rem;color:var(--text3);display:flex;align-items:center;gap:4px;overflow:hidden}
.card-loc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-actions{display:flex;align-items:center;gap:6px}
.conf-btn{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:.74rem;font-weight:600;font-family:inherit;cursor:pointer;transition:all .18s;white-space:nowrap}
.conf-btn:hover{border-color:rgba(16,208,126,.4);color:var(--yemek);background:rgba(16,208,126,.06)}
.conf-btn.on{border-color:rgba(16,208,126,.5);background:rgba(16,208,126,.1);color:var(--yemek)}
.shr-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border2);background:transparent;color:var(--text3);font-size:.82rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.shr-btn:hover{border-color:var(--border2);color:var(--text2);background:rgba(255,255,255,.05)}

/* EMPTY */
.empty-st{text-align:center;padding:60px 20px;color:var(--text3);position:relative;z-index:1}
.empty-ico{font-size:2.5rem;margin-bottom:12px;opacity:.3}
.empty-ttl{font-size:.93rem;font-weight:600;color:var(--text2);margin-bottom:6px}
.empty-sub{font-size:.78rem;line-height:1.7}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(14,22,38,.97);border:1px solid var(--border2);border-radius:10px;padding:10px 20px;font-size:.82rem;color:var(--text);font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,.5);backdrop-filter:blur(16px);transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s;opacity:0;z-index:9999;display:flex;align-items:center;gap:8px;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* MODAL BASE */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(12px);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s}
.mbg.open{opacity:1;pointer-events:all}
.modal{width:100%;max-width:480px;background:#080e1c;border:1px solid rgba(255,255,255,.1);border-radius:20px 20px 16px 16px;padding:22px;display:flex;flex-direction:column;gap:13px;transform:translateY(40px);transition:transform .3s cubic-bezier(.34,1.2,.64,1);max-height:92vh;overflow-y:auto}
.mbg.open .modal{transform:translateY(0)}
.modal-handle{width:40px;height:4px;background:rgba(255,255,255,.11);border-radius:2px;margin:-6px auto 0}
.modal-hdr{display:flex;align-items:center;justify-content:space-between}
.modal-ttl{font-family:'Syne',sans-serif;font-size:1.18rem;font-weight:800;letter-spacing:-.03em}
.modal-x{width:30px;height:30px;border-radius:7px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.modal-x:hover{background:rgba(255,255,255,.07);color:var(--text)}
.flbl{font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}

/* CAT GRID */
.cat-grid{display:flex;gap:6px;flex-wrap:wrap}
.cat-opt{flex:1;min-width:calc(33% - 6px);padding:9px 5px;border-radius:9px;border:1px solid var(--border);background:transparent;font-family:inherit;font-size:.73rem;font-weight:600;color:var(--text3);cursor:pointer;text-align:center;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:3px}
.cat-opt .oi{font-size:1.1rem}
.cat-opt:hover{border-color:var(--border2);color:var(--text2);background:rgba(255,255,255,.04)}
.cat-opt.sel[data-cat=kaza]{border-color:var(--kaza);color:var(--kaza);background:rgba(255,107,53,.1)}
.cat-opt.sel[data-cat=yemek]{border-color:var(--yemek);color:var(--yemek);background:rgba(16,208,126,.08)}
.cat-opt.sel[data-cat=etkinlik]{border-color:var(--etkinlik);color:var(--etkinlik);background:rgba(167,139,250,.1)}
.cat-opt.sel[data-cat=guvenlik]{border-color:var(--guvenlik);color:var(--guvenlik);background:rgba(255,59,92,.1)}
.cat-opt.sel[data-cat=diger]{border-color:var(--diger);color:var(--diger);background:rgba(107,140,186,.1)}

/* FORM */
.finp{width:100%;padding:11px 13px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.86rem;font-family:inherit;outline:none;transition:border-color .15s,background .15s}
.finp::placeholder{color:var(--text3)}
.finp:focus{border-color:rgba(79,142,247,.5);background:rgba(255,255,255,.06)}
textarea.finp{resize:vertical;min-height:88px;line-height:1.55}
.char-c{font-size:.65rem;color:var(--text3);text-align:right;margin-top:-7px}
.char-c.warn{color:var(--guvenlik)}

/* LOCATION PICKER */
.loc-picker-wrap{display:flex;flex-direction:column;gap:8px}
.loc-btns{display:flex;gap:7px}
.loc-btn{flex:1;height:38px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text2);font-size:.78rem;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.loc-btn:hover{border-color:var(--border2);color:var(--text);background:rgba(255,255,255,.07)}
.loc-btn.active{border-color:rgba(79,142,247,.5);color:var(--accent);background:rgba(79,142,247,.08)}
.loc-selected{display:flex;align-items:center;gap:6px;padding:8px 12px;background:rgba(79,142,247,.08);border:1px solid rgba(79,142,247,.2);border-radius:8px;font-size:.78rem;color:var(--accent)}
.loc-selected span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* PICK MAP */
.pick-map-container{height:220px;border-radius:12px;overflow:hidden;border:1px solid var(--border2);position:relative}
.pick-map-hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(8,14,28,.88);border:1px solid var(--border2);border-radius:8px;padding:5px 12px;font-size:.72rem;color:var(--text2);z-index:500;pointer-events:none;white-space:nowrap;backdrop-filter:blur(8px)}

.anon-row{display:flex;align-items:center;gap:10px;padding:10px 13px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:background .15s}
.anon-row:hover{background:rgba(255,255,255,.05)}
.tog-track{width:36px;height:20px;border-radius:10px;background:var(--text3);position:relative;transition:background .2s;flex-shrink:0}
.tog-track.on{background:var(--accent)}
.tog-thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:8px;background:#fff;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tog-track.on .tog-thumb{transform:translateX(16px)}
.anon-txt{font-size:.82rem;color:var(--text2)}
.anon-sub{font-size:.68rem;color:var(--text3)}
.btn-post{width:100%;height:46px;border-radius:11px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:inherit;font-weight:700;font-size:.9rem;cursor:pointer;box-shadow:0 4px 20px rgba(79,142,247,.3);transition:opacity .15s,transform .15s;margin-top:2px}
.btn-post:hover{opacity:.9;transform:translateY(-1px)}
.btn-post:disabled{opacity:.35;cursor:not-allowed;transform:none}

/* DETAIL MODAL */
.dbg{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(14px);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.dbg.open{opacity:1;pointer-events:all}
.dmodal{width:100%;max-width:480px;background:#08101e;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:0;transform:scale(.94);transition:transform .25s cubic-bezier(.34,1.2,.64,1);max-height:88vh;overflow-y:auto;overflow-x:hidden}
.dbg.open .dmodal{transform:scale(1)}

/* DETAIL MAP */
.detail-map-wrap{width:100%;height:200px;position:relative;border-radius:18px 18px 0 0;overflow:hidden}
.detail-map-wrap .leaflet-container{background:#080f1e}
.detail-map-overlay{position:absolute;bottom:0;left:0;right:0;height:60px;background:linear-gradient(transparent,#08101e);pointer-events:none;z-index:500}
.detail-no-map{width:100%;height:120px;background:rgba(255,255,255,.03);border-radius:18px 18px 0 0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--text3);font-size:.78rem;border-bottom:1px solid var(--border)}
.detail-body{padding:20px}
.d-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.d-badges{display:flex;gap:7px;flex-wrap:wrap}
.d-title{font-family:'Syne',sans-serif;font-size:1.22rem;font-weight:800;letter-spacing:-.03em;color:var(--text);margin-bottom:9px;line-height:1.3}
.d-desc{font-size:.87rem;color:var(--text2);line-height:1.7;margin-bottom:15px}
.d-meta{display:flex;flex-direction:column;gap:7px;padding:13px 15px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;margin-bottom:15px}
.d-meta-row{display:flex;align-items:center;gap:8px;font-size:.79rem;color:var(--text2)}
.d-meta-row span:first-child{color:var(--text3);font-size:.84rem;flex-shrink:0}
.d-actions{display:flex;gap:8px}
.conf-big{flex:1;height:44px;border-radius:10px;border:1px solid rgba(16,208,126,.35);background:rgba(16,208,126,.08);color:var(--yemek);font-family:inherit;font-weight:700;font-size:.87rem;cursor:pointer;transition:all .18s}
.conf-big:hover{background:rgba(16,208,126,.14)}
.conf-big.on{background:rgba(16,208,126,.16);border-color:rgba(16,208,126,.5)}
.maps-btn{height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:inherit;font-weight:600;font-size:.82rem;cursor:pointer;transition:all .18s;white-space:nowrap;display:flex;align-items:center;gap:5px}
.maps-btn:hover{background:rgba(255,255,255,.06);color:var(--text)}

/* LEAFLET DARK OVERRIDES */
.leaflet-tile-pane{filter:brightness(.7) saturate(.8) hue-rotate(200deg)}
.leaflet-container{font-family:'DM Sans',sans-serif}
.leaflet-popup-content-wrapper{background:#0d1525;border:1px solid var(--border2);border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.5);color:var(--text);padding:0}
.leaflet-popup-content{margin:10px 14px;font-size:.82rem;color:var(--text2);line-height:1.5}
.leaflet-popup-tip{background:#0d1525}
.leaflet-popup-close-button{color:var(--text3) !important;font-size:1rem !important}
.leaflet-control-zoom a{background:#0d1525 !important;color:var(--text2) !important;border-color:var(--border2) !important}
.leaflet-control-zoom a:hover{background:#1a2744 !important;color:var(--text) !important}
.leaflet-bar{border:1px solid var(--border2) !important;box-shadow:0 4px 12px rgba(0,0,0,.4) !important}
.leaflet-control-attribution{background:rgba(8,14,28,.8) !important;color:var(--text3) !important;font-size:.55rem !important;padding:2px 6px !important;border-radius:4px 0 0 0 !important;backdrop-filter:blur(4px)}
.leaflet-control-attribution a{color:var(--text3) !important}

::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:3px}
</style>
</head>
<body>
<div class="bg1"></div>
<div class="bg2"></div>

<!-- HEADER -->
<header class="hdr">
  <div class="logo-wrap">
    <div class="logo-mark">📍</div>
    <div class="logo-txt">civarda</div>
  </div>
  <div style="display:flex;align-items:center">
    <div class="hdr-stats">
      <div class="hdr-stat"><strong id="st-total">5</strong>gönderi</div>
      <div class="hdr-stat"><strong id="st-conf">165</strong>doğrulama</div>
    </div>
    <button class="btn-new" onclick="openModal()">
      <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M5.5 1v9M1 5.5h9" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      Paylaş
    </button>
  </div>
</header>

<!-- TICKER -->
<div class="ticker-wrap">
  <div class="ticker-lbl">🔴 Canlı</div>
  <div class="ticker-scrl"><div class="ticker-track" id="ticker"></div></div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="search-wrap">
    <span class="search-ico">🔍</span>
    <input class="search-inp" id="search" placeholder="Ara: kaza, yemek, mahalle..." oninput="applyFilters()">
  </div>
  <div class="filters">
    <button class="fbtn active" data-cat="all"      onclick="setFilter('all')">◎ Tümü <span class="fcnt" id="cnt-all">5</span></button>
    <button class="fbtn"        data-cat="kaza"     onclick="setFilter('kaza')">⚠ Kaza <span class="fcnt" id="cnt-kaza">1</span></button>
    <button class="fbtn"        data-cat="yemek"    onclick="setFilter('yemek')">🍽 Yemek <span class="fcnt" id="cnt-yemek">1</span></button>
    <button class="fbtn"        data-cat="etkinlik" onclick="setFilter('etkinlik')">◆ Etkinlik <span class="fcnt" id="cnt-etkinlik">1</span></button>
    <button class="fbtn"        data-cat="guvenlik" onclick="setFilter('guvenlik')">🛡 Güvenlik <span class="fcnt" id="cnt-guvenlik">1</span></button>
    <button class="fbtn"        data-cat="diger"    onclick="setFilter('diger')">◇ Diğer <span class="fcnt" id="cnt-diger">1</span></button>
  </div>
</div>

<!-- TRENDING -->
<div class="trending">
  <div class="trending-ttl">🔥 Trend Konular</div>
  <div class="trending-list" id="trending"></div>
</div>

<!-- LIVE BAR -->
<div class="live-bar">
  <div class="live-left">
    <div class="live-pill"><div class="live-dot"></div>Canlı</div>
    <span class="live-cnt" id="live-cnt">5 gönderi</span>
  </div>
  <button class="sort-btn" onclick="toggleSort()">
    <span id="sort-ico">↓</span> <span id="sort-lbl">Yeniye göre</span>
  </button>
</div>

<!-- FEED -->
<div class="feed" id="feed"></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- NEW POST MODAL -->
<div class="mbg" id="mbg" onclick="bgClick(event,'mbg')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-hdr">
      <span class="modal-ttl">Yeni Paylaşım</span>
      <button class="modal-x" onclick="closeModal()">×</button>
    </div>

    <div>
      <div class="flbl">Kategori</div>
      <div class="cat-grid">
        <button class="cat-opt sel" data-cat="kaza"     onclick="pickCat('kaza')"><span class="oi">⚠️</span>Kaza</button>
        <button class="cat-opt"     data-cat="yemek"    onclick="pickCat('yemek')"><span class="oi">🍽️</span>Yemek</button>
        <button class="cat-opt"     data-cat="etkinlik" onclick="pickCat('etkinlik')"><span class="oi">🎉</span>Etkinlik</button>
        <button class="cat-opt"     data-cat="guvenlik" onclick="pickCat('guvenlik')"><span class="oi">🛡️</span>Güvenlik</button>
        <button class="cat-opt"     data-cat="diger"    onclick="pickCat('diger')"><span class="oi">💬</span>Diğer</button>
      </div>
    </div>

    <div>
      <div class="flbl">Başlık</div>
      <input class="finp" id="f-title" maxlength="80" placeholder="Kısa ve net bir başlık..." oninput="cc(this,'tc',80)">
      <div class="char-c" id="tc">0 / 80</div>
    </div>

    <div>
      <div class="flbl">Açıklama</div>
      <textarea class="finp" id="f-desc" maxlength="280" placeholder="Ne görüyorsun? Detay ver..." oninput="cc(this,'dc',280)"></textarea>
      <div class="char-c" id="dc">0 / 280</div>
    </div>

    <div>
      <div class="flbl">Konum</div>
      <div class="loc-picker-wrap">
        <div class="loc-btns">
          <button class="loc-btn" id="gps-btn" onclick="getGPS()">📍 GPS Konumum</button>
          <button class="loc-btn active" id="map-btn" onclick="switchLocMode('map')">🗺 Haritadan Seç</button>
          <button class="loc-btn" id="txt-btn" onclick="switchLocMode('text')">⌨️ Manuel Gir</button>
        </div>
        <div id="loc-selected" style="display:none" class="loc-selected">
          <span>📍</span><span id="loc-selected-txt"></span>
        </div>
        <div id="pick-map-wrap" class="pick-map-container">
          <div class="pick-map-hint">Konumu seçmek için haritaya tıkla</div>
          <div id="pick-map" style="width:100%;height:100%"></div>
        </div>
        <input class="finp" id="f-loc-txt" placeholder="Mahalle, cadde veya bölge..." style="display:none">
      </div>
    </div>

    <div class="anon-row" onclick="toggleAnon()">
      <div>
        <div class="anon-txt">Anonim paylaş</div>
        <div class="anon-sub">Kimliğin gizli kalır</div>
      </div>
      <div style="margin-left:auto">
        <div class="tog-track on" id="anon-tog"><div class="tog-thumb"></div></div>
      </div>
    </div>

    <button class="btn-post" onclick="submitPost()">📍 Civarda'ya Paylaş</button>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="dbg" id="dbg" onclick="bgClick(event,'dbg')">
  <div class="dmodal" id="dmodal"></div>
</div>

<script>
'use strict';

/* ── CATEGORY CONFIG ── */
const CATS={
  kaza:    {label:'Kaza',    sym:'⚠',  icon:'⚠️',  color:'#ff6b35'},
  yemek:   {label:'Yemek',   sym:'🍽', icon:'🍽️', color:'#10d07e'},
  etkinlik:{label:'Etkinlik',sym:'◆',  icon:'🎉',  color:'#a78bfa'},
  guvenlik:{label:'Güvenlik',sym:'🛡', icon:'🛡️', color:'#ff3b5c'},
  diger:   {label:'Diğer',   sym:'◇',  icon:'💬',  color:'#6b8cba'},
};

/* ── SAMPLE DATA ── */
let posts=[
  {id:1,cat:'kaza',    title:'Trafik kazası — 2 araç',    desc:'Bağcılar D100 üzerinde 2 araç çarpışması. Yol sağ şerit kapalı. Ekipler bölgeye yönlendiriliyor, yavaş geçin.',              loc:'Bağcılar, D100 Karayolu',  lat:41.0390,lng:28.8560,ts:Date.now()-3*6e4,  confirms:12,confirmed:false,anon:true, isNew:true},
  {id:2,cat:'yemek',   title:'Bedava poğaça dağıtımı',    desc:'Yeni açılan fırın tanıtım kapsamında sokakta sıcak poğaça dağıtıyor. Stok azalıyor, acele edin!',                             loc:'Kadıköy, Moda Caddesi',    lat:40.9869,lng:29.0288,ts:Date.now()-11*6e4, confirms:34,confirmed:false,anon:false,isNew:false},
  {id:3,cat:'guvenlik',title:'Şüpheli plakasız araç',     desc:'Hasan Paşa Sokak\'ta saatlerdir park eden koyu gri plakasız araç var. Dikkatli olun, ilgili birime haber verebilirsiniz.',     loc:'Beşiktaş, Sinanpaşa Mah.', lat:41.0440,lng:29.0055,ts:Date.now()-28*6e4, confirms:7, confirmed:false,anon:true, isNew:false},
  {id:4,cat:'etkinlik',title:'Ücretsiz açık hava konseri',desc:'Belediye organizasyonu, akustik performans. Aile dostu, ücretsiz giriş. Sahne kurulumu 18:30\'da başlıyor.',                   loc:'Üsküdar Meydanı',          lat:41.0228,lng:29.0151,ts:Date.now()-45*6e4, confirms:89,confirmed:false,anon:false,isNew:false},
  {id:5,cat:'diger',   title:'ISKI planlı su kesintisi',  desc:'Bölgede bu gece 20:00 ile sabah 06:00 arası planlı bakım çalışması nedeniyle su kesintisi uygulanacak. Hazırlık yapın.',      loc:'Maltepe, Merkez Mah.',     lat:40.9350,lng:29.1309,ts:Date.now()-60*6e4, confirms:23,confirmed:false,anon:true, isNew:false},
];

/* ── STATE ── */
let curFilter='all', curSearch='', sortDesc=true;
let selCat='kaza', anonMode=true;
let pickedLat=null, pickedLng=null, pickedLocName='';
let locMode='map';
let pickMap=null, pickMarker=null;
let detailMap=null;

/* ── HELPERS ── */
function timeAgo(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<5)return'Şimdi';
  if(s<60)return s+' sn önce';
  if(s<3600)return Math.floor(s/60)+' dk önce';
  if(s<86400)return Math.floor(s/3600)+' sa önce';
  return Math.floor(s/86400)+' gün önce';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(msg,ico='✓'){
  const el=document.getElementById('toast');
  el.innerHTML=`<span>${ico}</span> ${msg}`;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>el.classList.remove('show'),2600);
}
function getList(){
  let l=[...posts];
  if(curFilter!=='all')l=l.filter(p=>p.cat===curFilter);
  if(curSearch){const q=curSearch.toLowerCase();l=l.filter(p=>p.title.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q)||p.loc.toLowerCase().includes(q));}
  l.sort((a,b)=>sortDesc?b.ts-a.ts:a.ts-b.ts);
  return l;
}
function totalConf(){return posts.reduce((a,p)=>a+p.confirms,0)}

/* ── CUSTOM MARKER ── */
function makeIcon(cat){
  const c=CATS[cat]||CATS.diger;
  return L.divIcon({
    className:'',
    html:`<div style="
      width:36px;height:36px;border-radius:50% 50% 50% 0;
      background:${c.color};border:2px solid rgba(255,255,255,.25);
      display:flex;align-items:center;justify-content:center;
      font-size:1rem;transform:rotate(-45deg);
      box-shadow:0 4px 14px rgba(0,0,0,.5);
    "><span style="transform:rotate(45deg)">${c.icon}</span></div>`,
    iconSize:[36,36],iconAnchor:[18,36],popupAnchor:[0,-38]
  });
}/* ── RENDER ── */
function renderFeed(){
  const feed=document.getElementById('feed');
  const list=getList();
  document.getElementById('live-cnt').textContent=list.length+' gönderi';
  document.getElementById('st-total').textContent=posts.length;
  document.getElementById('st-conf').textContent=totalConf();
  ['all','kaza','yemek','etkinlik','guvenlik','diger'].forEach(c=>{
    const el=document.getElementById('cnt-'+c);
    if(el)el.textContent=c==='all'?posts.length:posts.filter(p=>p.cat===c).length;
  });
  renderTrending();renderTicker();
  if(!list.length){
    feed.innerHTML=`<div class="empty-st"><div class="empty-ico">🔍</div><div class="empty-ttl">Sonuç bulunamadı</div><div class="empty-sub">Bu arama veya kategori için henüz paylaşım yok.<br>İlk sen paylaş!</div></div>`;
    return;
  }
  feed.innerHTML=list.map((p,i)=>`
    <div class="card" data-cat="${p.cat}" style="animation-delay:${Math.min(i,8)*.065}s" onclick="openDetail(${p.id})">
      <div class="card-inner">
        <div class="card-top">
          <div class="cat-badge" data-cat="${p.cat}">${CATS[p.cat].sym} ${CATS[p.cat].label}</div>
          ${p.isNew?'<div class="new-badge">🔴 Canlı</div>':''}
          <span class="card-time">🕐 ${timeAgo(p.ts)}</span>
        </div>
        <div class="card-title">${esc(p.title)}</div>
        <div class="card-desc">${esc(p.desc)}</div>
        <div class="card-bottom">
          <div class="card-loc"><span>📍</span><span>${esc(p.loc)}</span></div>
          <div class="card-actions">
            <button class="conf-btn${p.confirmed?' on':''}" onclick="event.stopPropagation();toggleConf(${p.id})">
              ${p.confirmed?'✓':'+'}  ${p.confirms} doğrulama
            </button>
            <button class="shr-btn" onclick="event.stopPropagation();copyLink(${p.id})" title="Kopyala">⬆</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

function renderTrending(){
  const counts={};
  posts.forEach(p=>{(p.title+' '+p.loc).split(/\s+/).forEach(w=>{if(w.length>3&&!/^\d+$/.test(w))counts[w]=(counts[w]||0)+1;});});
  document.getElementById('trending').innerHTML=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([w,c])=>`<div class="trend-chip" onclick="searchFor('${esc(w)}')">${esc(w)}<span class="trend-chip-cnt">${c}</span></div>`).join('');
}

function renderTicker(){
  const html=posts.slice(0,6).map(p=>`<div class="tick-item"><div class="tick-dot" style="background:${CATS[p.cat].color}"></div>${esc(p.title)} — ${esc(p.loc)}</div>`).join('');
  document.getElementById('ticker').innerHTML=html+html;
}

/* ── ACTIONS ── */
function toggleConf(id){
  const p=posts.find(x=>x.id===id);if(!p)return;
  p.confirmed=!p.confirmed;p.confirms+=p.confirmed?1:-1;
  renderFeed();
  toast(p.confirmed?'Doğruladın!':'Geri alındı',p.confirmed?'✅':'↩');
  if(document.getElementById('dbg').classList.contains('open'))openDetail(id);
}
function copyLink(id){
  const p=posts.find(x=>x.id===id);if(!p)return;
  navigator.clipboard.writeText(`📍 Civarda: ${p.title}\n📌 ${p.loc}\n\n${p.desc}`).then(()=>toast('Panoya kopyalandı','📋')).catch(()=>toast('Kopyalanamadı','⚠️'));
}
function setFilter(cat){curFilter=cat;document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));renderFeed();}
function applyFilters(){curSearch=document.getElementById('search').value;renderFeed();}
function toggleSort(){sortDesc=!sortDesc;document.getElementById('sort-ico').textContent=sortDesc?'↓':'↑';document.getElementById('sort-lbl').textContent=sortDesc?'Yeniye göre':'Eskiye göre';renderFeed();}
function searchFor(q){document.getElementById('search').value=q;curSearch=q;renderFeed();}

/* ── DETAIL MODAL ── */
function openDetail(id){
  const p=posts.find(x=>x.id===id);if(!p)return;
  const hasLoc=p.lat&&p.lng;
  document.getElementById('dmodal').innerHTML=`
    ${hasLoc
      ?`<div class="detail-map-wrap" id="dmap-wrap">
          <div id="dmap" style="width:100%;height:100%"></div>
          <div class="detail-map-overlay"></div>
        </div>`
      :`<div class="detail-no-map"><span style="font-size:2rem;opacity:.3">🗺</span><span>Konum belirtilmemiş</span></div>`
    }
    <div class="detail-body">
      <div class="d-hdr">
        <div class="d-badges">
          <div class="cat-badge" data-cat="${p.cat}">${CATS[p.cat].sym} ${CATS[p.cat].label}</div>
          ${p.isNew?'<div class="new-badge">🔴 Canlı</div>':''}
        </div>
        <button class="modal-x" onclick="closeDetail()">×</button>
      </div>
      <div class="d-title">${esc(p.title)}</div>
      <div class="d-desc">${esc(p.desc)}</div>
      <div class="d-meta">
        <div class="d-meta-row"><span>📍</span><span>${esc(p.loc)}</span></div>
        <div class="d-meta-row"><span>🕐</span><span>${timeAgo(p.ts)}</span></div>
        <div class="d-meta-row"><span>👤</span><span>${p.anon?'Anonim kullanıcı':'Civarda üyesi'}</span></div>
        <div class="d-meta-row"><span>✅</span><span>${p.confirms} kişi doğruladı</span></div>
      </div>
      <div class="d-actions">
        <button class="conf-big${p.confirmed?' on':''}" id="conf-big-btn" onclick="toggleConf(${p.id})">
          ${p.confirmed?'✓ Doğruladın — Geri al':'+ Ben de gördüm — Doğrula'}
        </button>
        ${hasLoc?`<button class="maps-btn" onclick="openMaps(${p.lat},${p.lng})">🗺 Yol Tarifi</button>`:''}
      </div>
    </div>
  `;
  document.getElementById('dbg').classList.add('open');

  if(hasLoc){
    setTimeout(()=>{
      if(detailMap){detailMap.remove();detailMap=null;}
      const dm=document.getElementById('dmap');
      if(!dm)return;
      detailMap=L.map('dmap',{zoomControl:false,attributionControl:true,scrollWheelZoom:false,dragging:false,doubleClickZoom:false,keyboard:false}).setView([p.lat,p.lng],15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(detailMap);
      L.marker([p.lat,p.lng],{icon:makeIcon(p.cat)}).addTo(detailMap);
      detailMap.invalidateSize();
    },100);
  }
}

function closeDetail(){
  document.getElementById('dbg').classList.remove('open');
  if(detailMap){detailMap.remove();detailMap=null;}
}

function openMaps(lat,lng){
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`,'_blank');
}

/* ── NEW POST MODAL ── */
function openModal(){
  document.getElementById('f-title').value='';
  document.getElementById('f-desc').value='';
  document.getElementById('f-loc-txt').value='';
  document.getElementById('tc').textContent='0 / 80';
  document.getElementById('dc').textContent='0 / 280';
  pickedLat=null;pickedLng=null;pickedLocName='';
  document.getElementById('loc-selected').style.display='none';
  pickCat('kaza');
  switchLocMode('map');
  document.getElementById('mbg').classList.add('open');
  setTimeout(()=>{
    initPickMap();
    document.getElementById('f-title').focus();
  },300);
}

function closeModal(){
  document.getElementById('mbg').classList.remove('open');
}

function bgClick(e,id){
  if(e.target===document.getElementById(id)){
    if(id==='dbg')closeDetail();
    else closeModal();
  }
}

function pickCat(cat){
  selCat=cat;
  document.querySelectorAll('.cat-opt').forEach(b=>b.classList.toggle('sel',b.dataset.cat===cat));
  if(pickMarker)pickMarker.setIcon(makeIcon(cat));
}

function toggleAnon(){
  anonMode=!anonMode;
  document.getElementById('anon-tog').classList.toggle('on',anonMode);
}

function cc(el,cid,max){
  const n=el.value.length;
  const c=document.getElementById(cid);
  c.textContent=n+' / '+max;
  c.classList.toggle('warn',n>max*.85);
}

/* ── LOCATION MODES ── */
function switchLocMode(mode){
  locMode=mode;
  const mapWrap=document.getElementById('pick-map-wrap');
  const txtInp=document.getElementById('f-loc-txt');
  document.querySelectorAll('.loc-btn').forEach(b=>b.classList.remove('active'));

  if(mode==='map'){
    document.getElementById('map-btn').classList.add('active');
    mapWrap.style.display='block';
    txtInp.style.display='none';
    setTimeout(()=>{initPickMap();},50);
  } else if(mode==='text'){
    document.getElementById('txt-btn').classList.add('active');
    mapWrap.style.display='none';
    txtInp.style.display='block';
    txtInp.focus();
  }
}

function initPickMap(){
  if(pickMap){pickMap.invalidateSize();return;}
  const center=[41.015,28.979]; // İstanbul
  pickMap=L.map('pick-map',{zoomControl:true,attributionControl:true}).setView(center,11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(pickMap);
  pickMap.on('click',function(e){
    pickedLat=e.latlng.lat;
    pickedLng=e.latlng.lng;
    pickedLocName=pickedLat.toFixed(5)+', '+pickedLng.toFixed(5);
    if(pickMarker)pickMarker.setLatLng(e.latlng);
    else pickMarker=L.marker(e.latlng,{icon:makeIcon(selCat),draggable:true}).addTo(pickMap);
    pickMarker.on('dragend',function(ev){
      pickedLat=ev.target.getLatLng().lat;
      pickedLng=ev.target.getLatLng().lng;
      pickedLocName=pickedLat.toFixed(5)+', '+pickedLng.toFixed(5);
      reverseGeocode(pickedLat,pickedLng);
      showLocSelected('📍 Konum seçildi (sürükleyerek ayarla)');
    });
    reverseGeocode(pickedLat,pickedLng);
    showLocSelected('📍 Konum seçildi — sürükleyerek ayarlayabilirsin');
  });
}

function reverseGeocode(lat,lng){
  fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=tr`)
    .then(r=>r.json())
    .then(d=>{
      const a=d.address||{};
      pickedLocName=[a.neighbourhood||a.suburb||a.quarter,a.district||a.city_district,a.city||a.town].filter(Boolean).join(', ')||d.display_name.split(',').slice(0,2).join(',');
      showLocSelected(pickedLocName);
    })
    .catch(()=>{});
}

function showLocSelected(name){
  const el=document.getElementById('loc-selected');
  document.getElementById('loc-selected-txt').textContent=name;
  el.style.display='flex';
}

function getGPS(){
  const btn=document.getElementById('gps-btn');
  btn.textContent='⏳ Konum alınıyor...';
  btn.classList.add('active');
  if(!navigator.geolocation){toast('Tarayıcın konumu desteklemiyor','⚠️');btn.textContent='📍 GPS Konumum';btn.classList.remove('active');return;}
  navigator.geolocation.getCurrentPosition(
    pos=>{
      pickedLat=pos.coords.latitude;
      pickedLng=pos.coords.longitude;
      btn.textContent='✓ Konumum alındı';
      switchLocMode('map');
      setTimeout(()=>{
        if(pickMap){
          pickMap.setView([pickedLat,pickedLng],16);
          if(pickMarker)pickMarker.setLatLng([pickedLat,pickedLng]);
          else pickMarker=L.marker([pickedLat,pickedLng],{icon:makeIcon(selCat),draggable:true}).addTo(pickMap);
        }
        reverseGeocode(pickedLat,pickedLng);
        showLocSelected('📍 GPS konumun alındı');
        toast('GPS konumun alındı!','📍');
      },200);
    },
    ()=>{
      toast('Konum alınamadı. İzin verdin mi?','⚠️');
      btn.textContent='📍 GPS Konumum';
      btn.classList.remove('active');
    }
  );
}

/* ── SUBMIT ── */
function submitPost(){
  const title=document.getElementById('f-title').value.trim();
  const desc=document.getElementById('f-desc').value.trim();
  const locTxt=document.getElementById('f-loc-txt').value.trim();

  if(!title){
    const inp=document.getElementById('f-title');
    inp.style.borderColor='var(--guvenlik)';inp.focus();
    setTimeout(()=>inp.style.borderColor='',2000);
    toast('Lütfen bir başlık gir','⚠️');return;
  }

  let lat=pickedLat, lng=pickedLng;
  let locName=pickedLocName||locTxt||'Konum belirtilmedi';

  posts.unshift({
    id:Date.now(),cat:selCat,title,
    desc:desc||'Açıklama girilmedi.',
    loc:locName,lat,lng,
    ts:Date.now(),confirms:0,confirmed:false,anon:anonMode,isNew:true
  });

  closeModal();
  setFilter('all');
  document.getElementById('search').value='';curSearch='';
  pickMap=null;pickMarker=null;
  renderFeed();
  toast('Paylaşıldı! Mahallen haberdar oldu 🎉','📍');
}

setInterval(renderFeed,30000);
renderFeed();
</script>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civarda - Yerel Akış</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <div class="w-full max-w-md bg-white shadow-xl min-h-screen pb-20">
        <!-- Header -->
        <header class="glass-effect sticky top-0 z-50 px-5 py-4 border-b border-gray-200 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight text-gray-900">Civarda</h1>
            <span class="text-xs font-semibold bg-blue-100 text-blue-600 px-3 py-1 rounded-full">Kayseri / Merkez</span>
        </header>

        <!-- Input Area -->
        <div class="p-5 border-b-8 border-gray-100">
            <textarea id="postContent" class="w-full bg-gray-50 p-4 rounded-xl outline-none border border-gray-200 focus:border-blue-500 transition" rows="3" placeholder="Civarda ne oluyor?"></textarea>
            <div class="flex justify-between items-center mt-3">
                <select id="postCategory" class="text-sm border-none bg-gray-100 rounded-lg px-3 py-2">
                    <option>🚨 Acil Durum</option>
                    <option>🎁 Fırsat / Bedava</option>
                    <option>📢 Genel Duyuru</option>
                </select>
                <button onclick="createNewPost()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-700">Paylaş</button>
            </div>
        </div>

        <!-- Feed Container -->
        <div id="feed" class="divide-y divide-gray-100">
            <!-- Örnek Başlangıç Gönderisi -->
            <article class="p-5">
                <div class="flex items-center gap-2 mb-2">
                    <span class="font-bold text-gray-800">Sistem</span>
                    <span class="bg-green-100 text-green-700 text-[10px] font-bold px-2 py-0.5 rounded uppercase">Güvenli</span>
                </div>
                <p class="text-gray-700">Civarda uygulamasına hoş geldiniz! İlk paylaşımınızı yaparak mahallenizle etkileşime başlayın.</p>
                <div class="flex gap-4 mt-4 text-gray-500">
                    <button onclick="vote(this, 1)" class="hover:text-green-600 transition"><i class="fa-solid fa-thumbs-up"></i> <span class="count">0</span></button>
                    <button onclick="vote(this, -1)" class="hover:text-red-600 transition"><i class="fa-solid fa-thumbs-down"></i> <span class="count">0</span></button>
                </div>
            </article>
        </div>
    </div>

    <script>
        function createNewPost() {
            const content = document.getElementById('postContent').value;
            const category = document.getElementById('postCategory').value;
            if (!content) return alert("Lütfen bir şeyler yazın.");

            const feed = document.getElementById('feed');
            const post = document.createElement('article');
            post.className = "p-5 animate-fadeIn";
            post.innerHTML = `
                <div class="flex items-center gap-2 mb-2">
                    <span class="font-bold text-gray-800">Sen</span>
                    <span class="bg-blue-100 text-blue-600 text-[10px] font-bold px-2 py-0.5 rounded uppercase">${category}</span>
                </div>
                <p class="text-gray-700">${content}</p>
                <div class="flex gap-4 mt-4 text-gray-500">
                    <button onclick="vote(this, 1)" class="hover:text-green-600 transition"><i class="fa-solid fa-thumbs-up"></i> <span class="count">0</span></button>
                    <button onclick="vote(this, -1)" class="hover:text-red-600 transition"><i class="fa-solid fa-thumbs-down"></i> <span class="count">0</span></button>
                </div>
            `;
            feed.prepend(post);
            document.getElementById('postContent').value = '';
        }

        function vote(btn, direction) {
            const countSpan = btn.querySelector('.count');
            let count = parseInt(countSpan.innerText);
            count += direction;
            countSpan.innerText = count;
            
            // Görsel geri bildirim
            btn.classList.add('scale-125', 'text-blue-600');
            setTimeout(() => btn.classList.remove('scale-125', 'text-blue-600'), 200);
        }
    </script>
</body>
</html>

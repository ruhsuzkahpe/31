<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Civarda | Kayseri</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: '#0f172a', accent: '#3b82f6' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animasyonlar */
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slideUp { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fadeIn { animation: fadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body class="text-slate-800 antialiased flex justify-center">

    <!-- Ana Konteyner -->
    <main class="w-full max-w-lg bg-white min-h-screen shadow-2xl relative pb-24 flex flex-col">
        
        <!-- Header -->
        <header class="glass sticky top-0 z-40 px-5 py-4 border-b border-slate-200 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight text-primary">Civarda</h1>
                <p class="text-xs font-medium text-slate-500 mt-0.5"><i class="fa-solid fa-location-dot text-accent mr-1"></i> Kayseri</p>
            </div>
            <button class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center hover:bg-slate-200 transition">
                <i class="fa-solid fa-magnifying-glass text-slate-600"></i>
            </button>
        </header>

        <!-- Kategori Filtreleri (Yatay Kaydırılabilir) -->
        <div class="flex gap-3 px-5 py-3 overflow-x-auto hide-scroll border-b border-slate-100 bg-white">
            <button class="whitespace-nowrap px-4 py-1.5 bg-primary text-white text-sm font-semibold rounded-full">Hepsi</button>
            <button class="whitespace-nowrap px-4 py-1.5 bg-slate-100 text-slate-600 text-sm font-semibold rounded-full hover:bg-slate-200">🚨 Acil</button>
            <button class="whitespace-nowrap px-4 py-1.5 bg-slate-100 text-slate-600 text-sm font-semibold rounded-full hover:bg-slate-200">🎁 Fırsat</button>
            <button class="whitespace-nowrap px-4 py-1.5 bg-slate-100 text-slate-600 text-sm font-semibold rounded-full hover:bg-slate-200">🚧 Trafik</button>
        </div>

        <!-- Akış (Feed) -->
        <div id="feedContainer" class="flex-1 divide-y divide-slate-100">
            <!-- Gönderiler JS ile buraya yüklenecek -->
        </div>

        <!-- Yüzen Ekle Butonu (FAB) -->
        <button onclick="toggleModal(true)" class="fixed bottom-24 right-5 sm:absolute sm:bottom-24 sm:right-5 w-14 h-14 bg-accent text-white rounded-full shadow-lg shadow-blue-500/30 flex items-center justify-center text-xl hover:scale-105 active:scale-95 transition-transform z-30">
            <i class="fa-solid fa-pen"></i>
        </button>

        <!-- Alt Navigasyon -->
        <nav class="glass fixed bottom-0 w-full max-w-lg border-t border-slate-200 flex justify-between px-8 py-3 pb-6 sm:pb-3 z-40">
            <button class="flex flex-col items-center text-primary gap-1"><i class="fa-solid fa-house text-xl"></i><span class="text-[10px] font-bold">Akış</span></button>
            <button class="flex flex-col items-center text-slate-400 hover:text-primary transition gap-1"><i class="fa-solid fa-map text-xl"></i><span class="text-[10px] font-bold">Harita</span></button>
            <button class="flex flex-col items-center text-slate-400 hover:text-primary transition gap-1"><i class="fa-regular fa-bell text-xl"></i><span class="text-[10px] font-bold">Bildirim</span></button>
            <button class="flex flex-col items-center text-slate-400 hover:text-primary transition gap-1"><i class="fa-regular fa-user text-xl"></i><span class="text-[10px] font-bold">Profil</span></button>
        </nav>
    </main>

    <!-- Yeni Gönderi Modalı (Açılır Pencere) -->
    <div id="postModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl p-5 transform translate-y-full sm:translate-y-0 transition-transform duration-300" id="modalContent">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-primary">Yeni Bildirim</h2>
                <button onclick="toggleModal(false)" class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-200"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <textarea id="postInput" class="w-full h-32 bg-slate-50 rounded-xl p-4 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-accent/50 resize-none" placeholder="Şu an ne görüyorsun?"></textarea>
            
            <div class="flex justify-between items-center mt-4">
                <select id="categoryInput" class="bg-slate-100 text-slate-700 font-semibold text-sm px-3 py-2 rounded-lg outline-none cursor-pointer">
                    <option value="genel">Genel</option>
                    <option value="acil">🚨 Acil Durum</option>
                    <option value="firsat">🎁 Fırsat</option>
                </select>
                <button onclick="submitPost()" class="bg-primary text-white font-bold py-2.5 px-6 rounded-xl shadow-md hover:bg-slate-800 active:scale-95 transition-all">Yayınla</button>
            </div>
        </div>
    </div>

    <!-- Toast Bildirim (Sistem Mesajları İçin) -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-5 py-3 rounded-full shadow-xl font-medium text-sm flex items-center gap-2 z-[60] transition-all duration-300 transform -translate-y-20 opacity-0">
        <i class="fa-solid fa-circle-check text-green-400"></i> <span id="toastMsg">İşlem başarılı</span>
    </div>

    <!-- JavaScript Mantığı -->
    <script>
        // Veritabanı simülasyonu (Veriler backend'den geliyormuş gibi)
        let posts = [
            { id: 1, author: "Meydan Fırını", isVerified: true, time: "10 dk önce", category: "Fırsat", content: "Askıda 20 adet taze ekmek bıraktık, ihtiyacı olanlar alabilir.", upvotes: 45, isUpvoted: false },
            { id: 2, author: "Sistem", isVerified: false, time: "1 saat önce", category: "Genel", content: "Civarda uygulamasına hoş geldiniz. Etrafınızdaki olayları anlık olarak paylaşmaya başlayın.", upvotes: 12, isUpvoted: false }
        ];

        const feedContainer = document.getElementById('feedContainer');

        // Gönderileri Ekrana Çizme Fonksiyonu
        function renderPosts() {
            feedContainer.innerHTML = '';
            posts.forEach(post => {
                const tagColor = post.category === 'Acil' ? 'bg-red-100 text-red-700' : post.category === 'Fırsat' ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-600';
                
                const postHTML = `
                    <article class="p-5 animate-slideUp bg-white">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center gap-2">
                                <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center font-bold text-slate-500">${post.author.charAt(0)}</div>
                                <div>
                                    <div class="flex items-center gap-1">
                                        <span class="font-bold text-sm text-primary">${post.author}</span>
                                        ${post.isVerified ? '<i class="fa-solid fa-circle-check text-accent text-xs"></i>' : ''}
                                    </div>
                                    <span class="text-xs text-slate-400">${post.time}</span>
                                </div>
                            </div>
                            <span class="px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider ${tagColor}">${post.category}</span>
                        </div>
                        <p class="text-slate-700 mt-3 leading-relaxed text-[15px]">${post.content}</p>
                        
                        <div class="flex items-center gap-6 mt-4 pt-3 border-t border-slate-50">
                            <button onclick="handleVote(${post.id})" class="flex items-center gap-1.5 text-sm font-semibold transition-colors ${post.isUpvoted ? 'text-accent' : 'text-slate-400 hover:text-slate-600'}">
                                <i class="${post.isUpvoted ? 'fa-solid' : 'fa-regular'} fa-thumbs-up text-lg transition-transform ${post.isUpvoted ? 'scale-110' : ''}"></i> 
                                <span>${post.upvotes}</span>
                            </button>
                            <button class="flex items-center gap-1.5 text-sm font-semibold text-slate-400 hover:text-slate-600 transition-colors">
                                <i class="fa-regular fa-comment text-lg"></i> <span>Yanıtla</span>
                            </button>
                        </div>
                    </article>
                `;
                feedContainer.insertAdjacentHTML('beforeend', postHTML);
            });
        }

        // Oy Verme Mantığı
        function handleVote(id) {
            const post = posts.find(p => p.id === id);
            if (post) {
                post.isUpvoted ? post.upvotes-- : post.upvotes++;
                post.isUpvoted = !post.isUpvoted;
                renderPosts();
            }
        }

        // Modal (Açılır Pencere) Kontrolü
        const modal = document.getElementById('postModal');
        const modalContent = document.getElementById('modalContent');
        
        function toggleModal(show) {
            if (show) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modalContent.classList.remove('translate-y-full');
                }, 10);
                document.getElementById('postInput').focus();
            } else {
                modal.classList.add('opacity-0');
                modalContent.classList.add('translate-y-full');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        }

        // Yeni Gönderi Ekleme
        function submitPost() {
            const input = document.getElementById('postInput');
            const categorySelect = document.getElementById('categoryInput');
            const content = input.value.trim();
            
            if (!content) {
                showToast("Lütfen bir içerik yazın!", "error");
                return;
            }

            const categoryText = categorySelect.options[categorySelect.selectedIndex].text.replace(/🚨 |🎁 /g, '');

            const newPost = {
                id: Date.now(),
                author: "Sen",
                isVerified: false,
                time: "Şimdi",
                category: categoryText,
                content: content,
                upvotes: 0,
                isUpvoted: false
            };

            posts.unshift(newPost); // Listeye en başa ekle
            renderPosts(); // Ekranı güncelle
            
            input.value = '';
            toggleModal(false);
            showToast("Başarıyla paylaşıldı!");
        }

        // Toast (Bildirim) Mesajı Gösterme
        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const icon = toast.querySelector('i');
            document.getElementById('toastMsg').innerText = message;
            
            icon.className = type === "success" ? "fa-solid fa-circle-check text-green-400" : "fa-solid fa-circle-exclamation text-red-400";
            
            toast.classList.remove('-translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('-translate-y-20', 'opacity-0'), 3000);
        }

        // Sayfa yüklendiğinde gönderileri çiz
        window.onload = renderPosts;
    </script>
</body>
</html>
